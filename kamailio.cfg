####### Routing Logic ########
request_route {

	if (is_method("REGISTER")) {

		if (!www_authenticate("$fd", "subscriber")) {
			www_challenge("$fd","1");
			exit;
		}	 
		
		save("location");

        	exit;
	}

	if (method==INVITE && !has_totag()){

		route(CNXCC);

		acc_db_request("$ci", "cdr");

		lookup("location");
		switch ($retcode) {
			case 1:
				$tu=$ru;
			break;

			case -1:
			case -3:                     
				sl_send_reply("404", "Not Found");
			exit;
			case -2:
				sl_send_reply("405", "Not Found");
			exit;
		};	
	}

	if (is_method("ACK|BYE")) {

		$rU=$tU;

		lookup("location");
		switch ($retcode) {
			case 1:
				$tu=$ru;
			break;

			case -1:
			case -3:                     
				sl_send_reply("404", "Not Found");
			exit;
			case -2:
				sl_send_reply("405", "Not Found");
			exit;
		};	
	}

	$rd=LOCAL_IP_PROXY;
	$rp=LOCAL_PORT;

	route(RELAY);
}

route[RELAY]{

        if (!t_relay()) {
	   sl_reply_error();
	}
        
	exit;
}

route[CNXCC]{

	redis_cmd("srvN", "DBSIZE", "r");
	$var(dbsize) = $redis(r=>value);

	$var(i) = 0;
	while ($var(i) < $var(dbsize)){

		$var(cmd) = "HGET cnxcc:" + $var(i) + " customer";
		redis_cmd("srvN", "$var(cmd)", "r");

		if ($redis(r=>value) == $fU){ 

			$var(cmd) = "HGET cnxcc:" + $var(i) + " max_time";
			redis_cmd("srvN", "$var(cmd)", "r");
			$var(max_time) = $redis(r=>value);

			cnxcc_set_max_time("$fU", $var(max_time));

			switch ($?) {
			case 1:
			    break;
			case -1:
			    xerr("Error setting up credit control");
			    sl_send_reply("503", "Internal Server Error");
			    exit;
			case -4:
			    xwarn("$ci already present for customer $fU");
			    exit;
			}

			break;
		}

		$var(i) = $var(i) + 1;
	}
}

