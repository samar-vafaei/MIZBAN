####### Routing Logic ########
request_route {

	if (is_method("REGISTER")) {

		if (!www_authenticate("$fd", "subscriber")) {
			www_challenge("$fd","1");
			exit;
		}	 
		
		save("location");

        	exit;
	}

	if (method==INVITE && !has_totag()){

		route(CNXCC);

		lookup("location");
		switch ($retcode) {
			case 1:
				$tu=$ru;
			break;

			case -1:
			case -3:                     
				sl_send_reply("404", "Not Found");
			exit;
			case -2:
				sl_send_reply("405", "Not Found");
			exit;
		};	
	}

	if (is_method("ACK|BYE")) {

		$rU=$tU;

		lookup("location");
		switch ($retcode) {
			case 1:
				$tu=$ru;
			break;

			case -1:
			case -3:                     
				sl_send_reply("404", "Not Found");
			exit;
			case -2:
				sl_send_reply("405", "Not Found");
			exit;
		};	
	}

	$rd=LOCAL_IP_PROXY;
	$rp=LOCAL_PORT;

	route(RELAY);
}

route[RELAY]{

        if (!t_relay()) {
	   sl_reply_error();
	}
        
	exit;
}

route[CNXCC]{

	$var(customer) = $fU;
	$var(max_time) = 120;

	cnxcc_set_max_time("$var(customer)", "$var(max_time)");

	switch ($?) {
	case 1:
	    break;
	case -1:
	    xerr("Error setting up credit control");
	    sl_send_reply("503", "Internal Server Error");
	    exit;
	case -4:
	    xwarn("$ci already present for customer $fU");
	    exit;
	}
}

