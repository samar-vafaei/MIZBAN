event_route[cnxcc:call-shutdown]
{
	xlog("L_INFO", "[$ci]: call killed");

	# update redis 
	redis_cmd("srvN", "DBSIZE", "r");
	$var(dbsize) = $redis(r=>value);

	$var(i) = 0;
	while ($var(i) < $var(dbsize)) {

		$var(cmd) = "HGET cnxcc:" + $var(i) + " customer";
		redis_cmd("srvN", "$var(cmd)", "r");

		if ($redis(r=>value) == $fU) { 

			$var(cmd) = "HSET cnxcc:" + $var(i) + " credit 0";
			redis_cmd("srvN", "$var(cmd)", "r");

			$var(cmd) = "HSET cnxcc:" + $var(i) + " max_time 0";
			redis_cmd("srvN", "$var(cmd)", "r");

			break;
		}

		$var(i) = $var(i) + 1;
	}
}

event_route[usrloc:contact-expired] {

    xlog("expired contact for $ulc(exp=>aor)\n");

    # HTTP POST request --- send http request to the FCM HTTP Server to notify expired register subscribers to re-register themselves
    $http_req(all) = $null;
    $http_req(suspend) = 0;
    $http_req(timeout) = HTTP_API_TIMEOUT;
    $http_req(method) = "POST";
    $http_req(hdr) = "Content-Type: application/json";
    $http_req(authmethod) = 1;
    $http_req(username) = "mizban";
    $http_req(password) = "password";

    $http_req(body) = "{'user':'" + $ulc(exp=>aor) + "'}";

    http_async_query(HTTP_API_PNS_ENDPOINT, "PNS_API_RESPONSE");
}

route[PNS_API_RESPONSE] {

    if ($http_ok && $http_rs == 200) {
        xlog("L_INFO","API PNS RESPONSE: $http_rb\n");
        return;
    }

    send_reply(500, "API Not Available");
    exit;
}
